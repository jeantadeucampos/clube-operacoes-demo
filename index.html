function select(name,values,current='',attrs=''){return `<select name="${name}" ${attrs}><option value="">Selecione</option>${values.map(v=>`<option value="${esc(v)}" ${v===current?'selected':''}>${esc(v)}</option>`).join('')}</select>`}function cell(name,sub=''){return `<b>${esc(name)}</b>${sub?`<small>${esc(sub)}</small>`:''}`}function clientOptions(){return data.clients.map(c=>c.name)}function metric(title,num,sub,ico){return `<div class="metric"><div class="metric-top">${title}<span class="metric-icon">${icon(ico)}</span></div><strong>${num}</strong><small>${sub}</small></div>`}

function closeModal(){$('#modal').classList.remove('open');$('#modalBody').innerHTML=''}
const dbReady=()=>new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error('Armazenamento de arquivos indisponível'));const q=indexedDB.open('clube_ops_files',1);q.onupgradeneeded=()=>q.result.createObjectStore('docs',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});

async function openVault(c){$('#modalTitle').textContent='Arquivos e senha gov.br · '+c.name;let docs=[];try{docs=await docsFor(c.id)}catch(e){toast(e.message)}const has=govMemory.has(c.id);$('#modalBody').innerHTML=`<div class="formgrid"><form id="govForm" class="full" data-client="${esc(c.id)}"><label class="field">Senha gov.br<input id="govInput" name="password" type="password" autocomplete="new-password" placeholder="Senha somente nesta sessão"></label><div class="actions"><button type="button" class="btn" data-action="reveal-gov">Exibir senha</button><button type="button" class="btn" data-action="copy-gov">Copiar senha</button><button class="btn primary" type="submit">Salvar na sessão</button></div><small class="subtle">A senha fica apenas na memória desta sessão e desaparece ao recarregar a página.</small></form><div class="field full"><b>Documentos (${docs.length}/20)</b><label class="field">Anexar arquivo(s)<input type="file" id="docFiles" multiple ${docs.length>=20?'disabled':''}></label><button class="btn" data-action="upload-docs" data-id="${esc(c.id)}" ${docs.length>=20?'disabled':''}>Anexar selecionados</button><div class="alerts">${docs.map(d=>`<div class="alertrow"><span>${esc(d.name)}<small>${new Date(d.added).toLocaleString('pt-BR')}</small></span><button class="btn" data-action="download-doc" data-id="${esc(d.id)}">Baixar</button></div>`).join('')||'<span class="subtle">Nenhum documento anexado.</span>'}</div></div></div><div class="formfoot"><button class="btn" data-action="close-modal">Fechar</button></div>`;const input=$('#govInput');if(has)input.value=govMemory.get(c.id)}

function setOwner(kind,id,next){const list=kind==='dispatch'?data.dispatch:kind==='task'?data.tasks:data.clients,x=list.find(i=>i.id===id);if(!x)return;const prev=x.owner;x.owner=next;if(kind!=='client'){x.transfers=x.transfers||[];x.transfers.push({from:prev||'Sem responsável',to:next,at:dt()})}persist(true,`Transferiu ${kind} ${id} de ${prev||'Sem responsável'} para ${next}`);render();toast('Responsável atualizado')}

function handleClick(event){const routeBtn=event.target.closest('[data-route]');if(routeBtn){route=routeBtn.dataset.route;render();return}const b=event.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
if(a==='close-modal'){closeModal();return}if(a==='mobile-menu'){$('#sidebar').classList.toggle('open');return}if(['new-client','new-gun','new-service','new-dispatch','new-task','new-guest','new-team','new-category','new-subcategory','edit-user','client-vault','new-record'].includes(a)){formFor(a,id);return}

async function uploadDocs(clientId){const input=$('#docFiles'),files=[...(input?.files||[])];if(!files.length){toast('Selecione os arquivos');return}try{const existing=await docsFor(clientId);if(existing.length+files.length>20){toast(`Limite: até 20 documentos por cliente. Restam ${20-existing.length}.`);return}const db=await dbReady();for(const f of files){const rec={id:mkid('DOC'),clientId,name:f.name,type:f.type,added:Date.now(),blob:f};await new Promise((resolve,reject)=>{const q=db.transaction('docs','readwrite').objectStore('docs').add(rec);q.onsuccess=resolve;q.onerror=()=>reject(q.error)})}persist(true,`Anexou ${files.length} documento(s) ao cliente ${data.clients.find(c=>c.id===clientId)?.name||''}`);toast('Documentos anexados');formFor('client-vault',clientId)}catch(e){toast('Falha ao anexar: '+e.message)}}
async function downloadDoc(docId){try{const db=await dbReady(),rec=await new Promise((resolve,reject)=>{const q=db.transaction('docs').objectStore('docs').get(docId);q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});if(!rec)return;const url=URL.createObjectURL(rec.blob),a=document.createElement('a');a.href=url;a.download=rec.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);persist(true,'Baixou documento '+rec.name);toast('Download iniciado')}catch(e){toast('Falha ao abrir documento')}}
